{% extends 'base.html' %}

{% block content %}
<h2>Twitter Messages Index</h2>

<img src="{{ url_for('static', path='giphy.gif') }}" alt="Twitter GIF" width="300" height="200">

{% for message in messages %}
    <div>
        <p><em>@{{ message.username }}</em>, Age: {{ message.age }}</p>
        <p>{{ message.message }}</p>
        <p>{{ message.created_at }}</p>
    </div>
{% endfor %}
{% endblock %}
